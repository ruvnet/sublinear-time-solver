name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: cargo build
        run: cargo build --workspace --all-targets
      - name: cargo test (lib + integration + doc)
        run: cargo test --workspace --all-targets
      - name: cargo test --doc
        run: cargo test --doc

  fmt-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
        continue-on-error: true   # existing tree has cosmetic drift; will tighten later
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --no-deps
        continue-on-error: true   # existing tree has 400+ pre-existing lints; tracked separately

  # Issue #19 (CWE-73 path traversal). The new safe-path tests pin the
  # MCP export_state / import_state contract — basename only, O_NOFOLLOW,
  # no escapes from the dedicated state directory. If these regress,
  # the same attack reopens.
  security-safe-path:
    name: safe-path regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: node --test tests/consciousness/safe-path.test.mjs
        run: node --test tests/consciousness/safe-path.test.mjs

  bench-smoke:
    name: cargo bench --quick (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: cargo bench --bench solver_benchmarks (smoke)
        run: cargo bench --bench solver_benchmarks -- --quick

  # ADR-001 item #1 + phase-2: regression-guard against silent
  # complexity-class downgrades. A PR that changes a public solver
  # from SubLinear → Linear (or any worse direction) fails CI unless
  # the author updates `.github/complexity-baseline.txt` deliberately.
  # That makes the type-level Complexity contract enforceable across
  # PRs the same way the safe-path security tests are.
  complexity-baseline-guard:
    name: complexity baseline (no silent downgrades)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: regenerate baseline + diff against checked-in
        run: |
          scripts/extract_complexity_classes.sh > /tmp/current-baseline.txt
          if ! diff -u .github/complexity-baseline.txt /tmp/current-baseline.txt; then
            echo "::error::Complexity-class baseline drifted. \
            A solver's CLASS changed without an accompanying update to \
            .github/complexity-baseline.txt. If this is intentional, \
            regenerate the baseline:"
            echo "   scripts/extract_complexity_classes.sh > .github/complexity-baseline.txt"
            echo "and include the diff in your PR. See ADR-001 for context."
            exit 1
          fi
          echo "Complexity baseline matches checked-in snapshot."

  # ADR-001 §SOTA: closes the last gap by exercising the
  # joules_per_decision example on every PR. GH Actions doesn't expose
  # per-job power counters (no RAPL access), so the run uses the
  # time-only fallback — but it still proves the energy-measurement code
  # path compiles, links, and runs end-to-end. A future self-hosted
  # runner on Linux-RAPL hardware or a Pi Zero 2W will surface real
  # J/solve numbers in the same job.
  joules-per-decision-smoke:
    name: joules_per_decision smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: cargo run --release --example joules_per_decision
        # Tight workload so the smoke job finishes in seconds. The point is
        # to catch bitrot (broken arch-gate, removed module path, etc.),
        # not to measure energy.
        run: |
          out=$(cargo run --release --example joules_per_decision -- --n 64 --iters 500 2>&1)
          echo "$out"
          # Assert the script produced the expected output structure.
          echo "$out" | grep -q "joules_per_decision" || (echo "::error::Missing run header"; exit 1)
          echo "$out" | grep -q "per_solve:" || (echo "::error::Missing per_solve line"; exit 1)
