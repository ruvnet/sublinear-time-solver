<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sublinear LLM - OpenAI API Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .status {
            background: #f0f0f0;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-family: monospace;
        }

        .status.ready {
            background: #d4edda;
            color: #155724;
        }

        .chat-area {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            height: 400px;
            overflow-y: auto;
            background: #fafafa;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 10px;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: #007bff;
            color: white;
            margin-left: 20%;
            text-align: right;
        }

        .message.assistant {
            background: #e9ecef;
            color: #333;
            margin-right: 20%;
        }

        .message.system {
            background: #fff3cd;
            color: #856404;
            text-align: center;
            font-size: 0.9em;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 24px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        select {
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
        }

        .stats {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 0.9em;
        }

        .loading {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 2px solid #007bff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Sublinear LLM</h1>
        <p class="subtitle">OpenAI API-Compatible WASM with Real Psycho-Symbolic Reasoning</p>

        <div class="status" id="status">
            ⏳ Initializing WASM module...
        </div>

        <div class="controls">
            <select id="model">
                <option value="sublinear-gpt5">GPT-5 Model</option>
                <option value="sublinear-o1">O1 Reasoning Model</option>
                <option value="sublinear-psycho-symbolic">Psycho-Symbolic</option>
            </select>

            <select id="reasoning">
                <option value="">Standard</option>
                <option value="minimal">Minimal Reasoning</option>
                <option value="low">Low Reasoning</option>
                <option value="medium">Medium Reasoning</option>
                <option value="high">High Reasoning</option>
            </select>

            <button onclick="clearChat()">Clear Chat</button>
            <button onclick="showStats()">Show Stats</button>
        </div>

        <div class="chat-area" id="chat">
            <div class="message system">
                Welcome! This is a fully client-side LLM running in your browser via WASM.
                It's OpenAI API compatible with real knowledge graph reasoning.
            </div>
        </div>

        <div class="input-group">
            <input type="text" id="input" placeholder="Ask me anything..." disabled>
            <button id="send" onclick="sendMessage()" disabled>Send</button>
        </div>

        <div class="stats" id="stats" style="display: none;"></div>
    </div>

    <script type="module">
        import init, { SublinearLLM } from './pkg/sublinear_llm.js';

        let llm = null;
        let messageCount = 0;

        async function initialize() {
            try {
                await init();
                llm = new SublinearLLM();

                // Update status
                const status = document.getElementById('status');
                status.className = 'status ready';
                status.innerHTML = '✅ Ready! WASM module loaded with 45+ knowledge triples';

                // Enable input
                document.getElementById('input').disabled = false;
                document.getElementById('send').disabled = false;

                // Get initial stats
                const health = JSON.parse(llm.healthCheck());
                console.log('Health check:', health);

                // Focus input
                document.getElementById('input').focus();
            } catch (error) {
                console.error('Initialization error:', error);
                document.getElementById('status').innerHTML = '❌ Failed to initialize: ' + error.message;
            }
        }

        window.sendMessage = async function() {
            const input = document.getElementById('input');
            const message = input.value.trim();

            if (!message || !llm) return;

            // Disable input while processing
            input.disabled = true;
            document.getElementById('send').disabled = true;

            // Add user message
            addMessage(message, 'user');
            input.value = '';

            // Show typing indicator
            const typingId = 'typing-' + Date.now();
            addMessage('<span class="loading"></span> Thinking...', 'assistant', typingId);

            try {
                // Get selected model and reasoning
                const model = document.getElementById('model').value;
                const reasoning = document.getElementById('reasoning').value;

                let response;

                if (model === 'sublinear-o1' && reasoning) {
                    // Use Responses API for o1 model with reasoning
                    const request = {
                        model: model,
                        messages: [
                            { role: "user", content: message }
                        ],
                        reasoning_effort: reasoning,
                        max_output_tokens: 300
                    };

                    response = JSON.parse(llm.responsesAPI(JSON.stringify(request)));

                    // Remove typing indicator
                    document.getElementById(typingId).remove();

                    // Add response
                    const text = response.output[0].content[0].text;
                    addMessage(text, 'assistant');

                    // Show reasoning if available
                    if (response.reasoning && response.reasoning.reasoning_chains.length > 0) {
                        const reasoningInfo = `🧠 Reasoning: ${response.reasoning.summary} (${response.reasoning.tokens} tokens)`;
                        addMessage(reasoningInfo, 'system');
                    }
                } else {
                    // Use Chat Completions API
                    const request = {
                        model: model,
                        messages: [
                            { role: "system", content: "You are a helpful AI assistant with deep knowledge." },
                            { role: "user", content: message }
                        ],
                        temperature: 0.7,
                        max_tokens: 200
                    };

                    if (reasoning && model === 'sublinear-o1') {
                        request.reasoning_effort = reasoning;
                    }

                    response = JSON.parse(llm.chatCompletions(JSON.stringify(request)));

                    // Remove typing indicator
                    document.getElementById(typingId).remove();

                    // Add response
                    const text = response.choices[0].message.content;
                    addMessage(text, 'assistant');

                    // Show token usage
                    if (response.usage.reasoning_tokens) {
                        const usage = `📊 Tokens - Prompt: ${response.usage.prompt_tokens}, Completion: ${response.usage.completion_tokens}, Reasoning: ${response.usage.reasoning_tokens}`;
                        addMessage(usage, 'system');
                    }
                }

                messageCount++;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById(typingId).remove();
                addMessage('❌ Error: ' + error.message, 'system');
            }

            // Re-enable input
            input.disabled = false;
            document.getElementById('send').disabled = false;
            input.focus();
        };

        function addMessage(text, type, id) {
            const chat = document.getElementById('chat');
            const message = document.createElement('div');
            message.className = `message ${type}`;
            if (id) message.id = id;
            message.innerHTML = text;
            chat.appendChild(message);
            chat.scrollTop = chat.scrollHeight;
        }

        window.clearChat = function() {
            const chat = document.getElementById('chat');
            chat.innerHTML = '<div class="message system">Chat cleared. Ready for new conversation.</div>';
            messageCount = 0;
        };

        window.showStats = function() {
            if (!llm) return;

            const stats = JSON.parse(llm.getStats());
            const health = JSON.parse(llm.healthCheck());

            const statsDiv = document.getElementById('stats');
            statsDiv.style.display = 'block';
            statsDiv.innerHTML = `
                <strong>📊 Statistics</strong><br>
                Total Requests: ${stats.total_requests}<br>
                Knowledge Triples: ${stats.knowledge_graph.triples}<br>
                Type: ${stats.knowledge_graph.type}<br>
                Capabilities: ${stats.reasoning_capabilities.join(', ')}<br>
                <br>
                <strong>🏥 Health</strong><br>
                Status: ${health.status}<br>
                Real Implementation: ${health.real}<br>
                Models: ${health.models.join(', ')}<br>
                Features: ${Object.entries(health.features).filter(([k,v]) => v).map(([k]) => k).join(', ')}
            `;

            setTimeout(() => {
                statsDiv.style.display = 'none';
            }, 5000);
        };

        // Handle Enter key
        document.getElementById('input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                window.sendMessage();
            }
        });

        // Initialize on load
        initialize();
    </script>
</body>
</html>
