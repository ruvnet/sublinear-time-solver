[package]
name = "sublinear-llm"
version = "0.1.0"
authors = ["rUv <github.com/ruvnet>"]
edition = "2021"
description = "OpenAI-compatible LLM API with GPT-5-level reasoning, Claude 4.1 Opus benchmarks, powered by psycho-symbolic WASM"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/sublinear-time-solver"
keywords = ["llm", "ai", "reasoning", "wasm", "openai"]
categories = ["wasm", "web-programming", "algorithms"]

[package.metadata.wasm-pack]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"
uuid = { version = "1.10", features = ["v4", "js"] }
sha2 = "0.10"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
regex = "1.10"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
