[package]
name = "temporal-lead-solver"
version = "0.1.2"
edition = "2021"
authors = ["rUv <github.com/ruvnet>"]
description = "Temporal computational lead via sublinear local solvers for diagonally dominant systems"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/sublinear-time-solver"
keywords = ["sublinear", "solver", "diagonal-dominance", "temporal", "prediction"]
categories = ["algorithms", "science", "mathematics"]
# Anchored allow-list: 0.1.1 shipped a 3.9 MB debug ELF (`demo`) and the npm
# shim because nothing limited the crate contents.
include = [
    "/src/**/*.rs",
    "/examples/*.rs",
    "/Cargo.toml",
    "/README.md",
]

[lib]
name = "temporal_lead"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "temporal-cli"
path = "src/bin/cli.rs"

[dependencies]
# 0.1.2: removed num-complex, serde_json, nalgebra, criterion, chrono,
# indicatif, statrs, approx, rand_distr, tokio and futures. Nothing in src/
# or examples/ referenced them.
ndarray = { version = "0.15", features = ["serde"] }
rayon = { version = "1.7", optional = true }
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
sprs = "0.11"
rand = "0.8"
log = "0.4"
env_logger = "0.10"
colored = "2.0"

[dev-dependencies]
proptest = "1.4"
quickcheck = "1.0"
test-case = "3.1"
pretty_assertions = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"

[features]
default = ["parallel"]
parallel = ["rayon"]
cuda = []  # Future: CUDA support
quantum = []  # Future: Quantum simulation
