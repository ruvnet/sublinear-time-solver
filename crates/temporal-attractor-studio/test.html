<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporal Attractor Studio - WASM Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        h1 {
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .test-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
        }
        .result {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-family: monospace;
        }
        .success {
            color: #4ade80;
        }
        .error {
            color: #f87171;
        }
        button {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        button:hover {
            background: #059669;
        }
        #status {
            text-align: center;
            font-size: 1.2em;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>🌌 Temporal Attractor Studio WASM Test</h1>

    <div id="status">Loading WASM module...</div>

    <div class="test-section">
        <h2>Test Results</h2>
        <div id="results"></div>
    </div>

    <div class="test-section">
        <h2>Interactive Tests</h2>
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="testLyapunov()">Test Lyapunov</button>
        <button onclick="testEmbedding()">Test Embedding</button>
        <button onclick="testEchoNetwork()">Test Echo Network</button>
        <button onclick="testFractal()">Test Fractal Dimension</button>
    </div>

    <script type="module">
        import init, * as tas from './pkg/temporal_attractor_studio.js';

        let studio;

        async function initWasm() {
            await init();
            studio = new tas.TemporalAttractorStudio();
            document.getElementById('status').innerHTML = '✅ WASM module loaded successfully!';

            // Show version
            addResult(`Version: ${tas.version()}`, 'success');

            // Run initial test
            window.runAllTests();
        }

        function addResult(message, type = 'info') {
            const resultsDiv = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.textContent = message;
            resultsDiv.appendChild(div);
        }

        window.runAllTests = async function() {
            document.getElementById('results').innerHTML = '';

            await window.testLyapunov();
            await window.testEmbedding();
            await window.testEchoNetwork();
            await window.testFractal();

            addResult('✨ All tests completed!', 'success');
        }

        window.testLyapunov = function() {
            try {
                const lorenzData = tas.generate_lorenz_data(500, 0.01);
                const result = studio.calculate_lyapunov(lorenzData, 3, 0.01, 12, 20, 200, 1e-10);

                addResult(`✅ Lyapunov Test:`, 'success');
                addResult(`   λ = ${result.lambda.toFixed(4)}`);
                addResult(`   Chaotic: ${result.is_chaotic}`);
                addResult(`   Level: ${result.chaos_level}`);
                addResult(`   Lyapunov time: ${result.lyapunov_time.toFixed(2)} units`);
            } catch (error) {
                addResult(`❌ Lyapunov Test Failed: ${error}`, 'error');
            }
        }

        window.testEmbedding = function() {
            try {
                const series = Array.from({length: 50}, (_, i) => Math.sin(i * 0.1));
                const embedded = studio.delay_embedding(series, 3, 2);
                addResult(`✅ Embedding Test: ${series.length} → ${embedded.length / 3} vectors`, 'success');
            } catch (error) {
                addResult(`❌ Embedding Test Failed: ${error}`, 'error');
            }
        }

        window.testEchoNetwork = function() {
            try {
                studio.init_echo_network(50, 3, 3, 0.95, 0.1, 0.5, 0.3, 1e-6);

                const lorenzData = tas.generate_lorenz_data(100, 0.01);
                const trainSamples = 30;
                const trainInputs = lorenzData.slice(0, trainSamples * 3);
                const trainTargets = lorenzData.slice(3, (trainSamples + 1) * 3);

                const mse = studio.train_echo_network(trainInputs, trainTargets, trainSamples, 3, 3);

                const prediction = studio.predict_next([1.0, 1.0, 1.0]);

                addResult(`✅ Echo Network Test:`, 'success');
                addResult(`   MSE: ${mse.toFixed(6)}`);
                addResult(`   Prediction: [${prediction.map(v => v.toFixed(2)).join(', ')}]`);
            } catch (error) {
                addResult(`❌ Echo Network Test Failed: ${error}`, 'error');
            }
        }

        window.testFractal = function() {
            try {
                const henonData = tas.generate_henon_data(200);
                const dimension = studio.estimate_fractal_dimension(henonData, 2);
                addResult(`✅ Fractal Dimension Test: ${dimension.toFixed(3)}`, 'success');
            } catch (error) {
                addResult(`❌ Fractal Test Failed: ${error}`, 'error');
            }
        }

        // Initialize on load
        initWasm().catch(console.error);
    </script>
</body>
</html>
