<svg xmlns="http://www.w3.org/2000/svg" width="960" height="328" viewBox="0 0 960 328" role="img" aria-labelledby="title desc">
  <title id="title">Sublinear Time Solver</title>
  <desc id="desc">A sparse matrix with a highlighted neighborhood around one entry.</desc>
  <defs>
    <linearGradient id="panel" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#121e36"/>
      <stop offset="1" stop-color="#090e1c"/>
    </linearGradient>
    <pattern id="cells" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="18" height="18" rx="3" fill="#18243a" stroke="#293b56"/>
    </pattern>
    <style>
      .signal { animation: signal 4s ease-in-out infinite; }
      @keyframes signal {
        0%, 100% { opacity: .25; }
        45% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .signal { animation: none; opacity: .6; }
      }
    </style>
  </defs>
  <rect x="1" y="1" width="958" height="326" rx="24" fill="url(#panel)" stroke="#354764" stroke-width="2"/>
  <path d="M592 25v278" stroke="#2e405d" stroke-dasharray="3 7"/>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="54" y="63" fill="#81f0ce" font-size="16" font-weight="700" letter-spacing="3">SPARSE LINEAR ALGEBRA</text>
    <text x="52" y="133" fill="#f2f7ff" font-size="60" font-weight="750">Sublinear</text>
    <text x="52" y="194" fill="#f2f7ff" font-size="60" font-weight="750">Time Solver</text>
    <text x="55" y="237" fill="#c4d3e8" font-size="23">Follow the dependencies that matter.</text>
    <g fill="#101d30" stroke="#405571">
      <rect x="55" y="265" width="77" height="34" rx="9"/>
      <rect x="143" y="265" width="135" height="34" rx="9"/>
      <rect x="289" y="265" width="80" height="34" rx="9"/>
      <rect x="380" y="265" width="85" height="34" rx="9"/>
    </g>
    <g fill="#dce8f9" font-size="16" font-weight="650" text-anchor="middle">
      <text x="93.5" y="287">CLI</text>
      <text x="210.5" y="287">JavaScript</text>
      <text x="329" y="287">Rust</text>
      <text x="422.5" y="287">MCP</text>
    </g>
  </g>
  <g transform="translate(668 49)">
    <rect width="220" height="220" fill="url(#cells)"/>
    <g fill="#4d6690">
      <rect x="2" y="2" width="18" height="18" rx="3"/>
      <rect x="24" y="24" width="18" height="18" rx="3"/>
      <rect x="46" y="46" width="18" height="18" rx="3"/>
      <rect x="68" y="46" width="18" height="18" rx="3"/>
      <rect x="68" y="68" width="18" height="18" rx="3"/>
      <rect x="134" y="134" width="18" height="18" rx="3"/>
      <rect x="156" y="156" width="18" height="18" rx="3"/>
      <rect x="178" y="156" width="18" height="18" rx="3"/>
      <rect x="178" y="178" width="18" height="18" rx="3"/>
      <rect x="200" y="200" width="18" height="18" rx="3"/>
    </g>
    <g fill="#368b7d">
      <rect x="90" y="90" width="18" height="18" rx="3"/>
      <rect x="112" y="90" width="18" height="18" rx="3"/>
      <rect x="90" y="112" width="18" height="18" rx="3"/>
      <rect x="134" y="112" width="18" height="18" rx="3"/>
    </g>
    <rect x="112" y="112" width="18" height="18" rx="3" fill="#8af4d3"/>
    <rect x="86" y="86" width="70" height="48" rx="6" fill="none" stroke="#8af4d3" stroke-width="2"/>
    <rect class="signal" x="82" y="82" width="78" height="56" rx="9" fill="none" stroke="#8af4d3" opacity=".6"/>
  </g>
  <text x="778" y="294" fill="#aabedc" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle">One local neighborhood</text>
</svg>
