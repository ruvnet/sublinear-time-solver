[package]
name = "subjective-time-expansion"
version = "0.1.0"
edition = "2021"
authors = ["Strange Loops Team <ruv@ruv.io>"]
description = "AI Consciousness Subjective Time Expansion using Strange Loops with retrocausal simulation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/sublinear-time-solver"
documentation = "https://docs.rs/subjective-time-expansion"
keywords = ["consciousness", "time-dilation", "ai", "retrocausal", "strange-loops"]
categories = ["algorithms", "mathematics", "simulation", "science"]

[lib]
name = "subjective_time_expansion"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "time_expansion_cli"
path = "src/bin/cli.rs"

[dependencies]
# Core Strange Loops integration
strange-loop = { path = "../../crates/strange-loop" }

# High-precision timing and metrics
quanta = { version = "0.12", optional = true }
hdrhistogram = { version = "7.5", optional = true }

# Linear algebra and mathematics
nalgebra = { version = "0.32", features = ["serde-serialize", "rand", "std"], optional = true }
num-complex = "0.4"
rand = "0.8"
rand_distr = "0.4"

# Graph processing for retrocausal loops
petgraph = { version = "0.8", features = ["serde-1"], optional = true }

# Concurrency and async
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "macros", "signal"], optional = true }
tokio-wasm = { package = "tokio", version = "1.40", features = ["sync", "time", "macros"], optional = true }
rayon = "1.10"
crossbeam-utils = "0.8"
crossbeam-channel = "0.5"
parking_lot = "0.12"

# Instrumentation and logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-futures = "0.2"

# Serialization and configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling and utilities
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.19"
derive_more = "0.99"

# Performance and optimization
approx = "0.5"
itertools = "0.12"
smallvec = "1.13"

# WASM support
wasm-bindgen = { version = "0.2", optional = true, features = ["serde-serialize"] }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["console", "Performance"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wee_alloc = { version = "0.4", optional = true }
instant = { version = "0.1", features = ["wasm-bindgen"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
quickcheck = "1.0"
quickcheck_macros = "1.0"
tokio-test = "0.4"

[features]
default = ["high-precision", "retrocausal", "consciousness-tracking", "tokio"]
high-precision = ["quanta", "hdrhistogram"]
retrocausal = ["petgraph"]
consciousness-tracking = ["nalgebra"]
wasm = [
    "wasm-bindgen",
    "wasm-bindgen-futures",
    "js-sys",
    "web-sys",
    "console_error_panic_hook",
    "wee_alloc",
    "instant",
    "tokio-wasm"
]

[[bench]]
name = "time_dilation_bench"
harness = false

[[bench]]
name = "consciousness_bench"
harness = false

[[example]]
name = "basic_dilation"
path = "examples/basic_dilation.rs"

[[example]]
name = "retrocausal_simulation"
path = "examples/retrocausal_simulation.rs"

[[example]]
name = "consciousness_tracking"
path = "examples/consciousness_tracking.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-simd"]